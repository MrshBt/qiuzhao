name: Daily Qiuzhao Scraper

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 08:00(UTC+8)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qiuzhao-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/main.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/feed.xml
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: daily update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const d = new Date().toISOString();
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner, repo,
              title: '⚠️ 每日爬虫运行失败 ' + d,
              body: '请在 Actions 页面查看日志:\nhttps://github.com/' + owner + '/' + repo + '/actions/workflows/daily.yml\n\n可能原因:信息源接口变更或网络问题。',
            });

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
